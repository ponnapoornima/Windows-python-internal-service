name: Deploy Python Internal Polling Service to VM

on:
  push:
    branches:
      - developer

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Deploy and Start Polling Service on VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            VM_USER="${{ secrets.VM_USER }}"
            APP_DIR="/home/$VM_USER/Internal-Python-Service"
            SERVICE_FILE="/etc/systemd/system/python-polling.service"

            cd /home/$VM_USER

            # Clone repo if missing
            if [ ! -d "Internal-Python-Service" ]; then
              git clone https://github.com/CleavelandPrice-3KT/Internal-Python-Service.git
            fi

            cd Internal-Python-Service

            # Reset to latest developer branch
            git fetch --all
            git reset --hard origin/developer

            # Install dependencies
            sudo apt update
            sudo apt install -y python3 python3-venv python3-pip git

            # Create virtual environment if missing
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            # Activate venv and install Python packages
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            # Create or update systemd service line by line
            echo "[Unit]" | sudo tee $SERVICE_FILE
            echo "Description=Python Internal Polling Service" | sudo tee -a $SERVICE_FILE
            echo "After=network.target" | sudo tee -a $SERVICE_FILE
            echo "" | sudo tee -a $SERVICE_FILE
            echo "[Service]" | sudo tee -a $SERVICE_FILE
            echo "User=$VM_USER" | sudo tee -a $SERVICE_FILE
            echo "WorkingDirectory=$APP_DIR" | sudo tee -a $SERVICE_FILE
            echo "ExecStart=$APP_DIR/venv/bin/python main.py" | sudo tee -a $SERVICE_FILE
            echo "Restart=always" | sudo tee -a $SERVICE_FILE
            echo "RestartSec=5" | sudo tee -a $SERVICE_FILE
            echo "" | sudo tee -a $SERVICE_FILE
            echo "[Install]" | sudo tee -a $SERVICE_FILE
            echo "WantedBy=multi-user.target" | sudo tee -a $SERVICE_FILE

            # Reload systemd and restart service
            sudo systemctl daemon-reload
            sudo systemctl enable python-polling.service
            sudo systemctl restart python-polling.service

            # Show status
            sudo systemctl status python-polling.service --no-pager

            # Tail last 50 lines of logs
            echo "Last 50 lines of polling service logs:"
            sudo journalctl -u python-polling.service -n 50 --no-pager
