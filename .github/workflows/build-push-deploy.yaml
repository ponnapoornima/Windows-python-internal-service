name: Deploy and Run Python Polling Service (Windows VM)

on:
  push:
    branches:
      - developer
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Windows VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            powershell -Command "
            cd 'C:\Users\azureuser\python-internal-service';

            Write-Host 'Creating .env file...';

            Set-Content -Path .env -Value 'MSSQL_HOST=${{ secrets.MSSQL_HOST }}';
            Add-Content -Path .env -Value 'MSSQL_DATABASE=${{ secrets.MSSQL_DATABASE }}';
            Add-Content -Path .env -Value 'MSSQL_USERNAME=${{ secrets.MSSQL_USERNAME }}';
            Add-Content -Path .env -Value 'MSSQL_PASSWORD=${{ secrets.MSSQL_PASSWORD }}';
            Add-Content -Path .env -Value 'EXTERNAL_API_BASE_URL=${{ secrets.EXTERNAL_API_BASE_URL }}';
            Add-Content -Path .env -Value 'APIM_SUBSCRIPTION_KEY=${{ secrets.APIM_SUBSCRIPTION_KEY }}';

            Add-Content -Path .env -Value 'POLL_INTERVAL_SECONDS=5';
            Add-Content -Path .env -Value 'MAX_CONCURRENT_JOBS=3';
            Add-Content -Path .env -Value 'REQUEST_TIMEOUT_SECONDS=120';
            Add-Content -Path .env -Value 'MAX_RETRIES=3';
            Add-Content -Path .env -Value 'RETRY_DELAY_SECONDS=5.0';

            Add-Content -Path .env -Value 'LOG_LEVEL=INFO';
            Add-Content -Path .env -Value 'LOG_FILE=logs/service.log';

            Write-Host '.env created successfully';
            Get-Content .env;

            Write-Host 'Stopping old process (if any)...';
            taskkill /IM python.exe /F -ErrorAction SilentlyContinue;

            Write-Host 'Starting app...';
            Start-Process python -ArgumentList 'main.py';
            "
