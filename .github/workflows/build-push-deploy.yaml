name: Deploy Python Polling Service (Windows VM)

on:
  push:
    branches:
      - developer
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Copy full project to VM
      - name: Copy project files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "C:/Users/azureuser/python-internal-service"

      # Step 3: Deploy on VM
      - name: Deploy Application on Windows VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            powershell -ExecutionPolicy Bypass -Command "

            Write-Host 'Starting deployment...'

            \$projectPath = 'C:\Users\azureuser\python-internal-service'
            \$envPath = \"\$projectPath\.env\"

            Set-Location \$projectPath

            # -----------------------------
            # Create .env file (FIXED)
            # -----------------------------
            New-Item -Path \$envPath -ItemType File -Force

            Add-Content \$envPath 'MSSQL_HOST=${{ secrets.MSSQL_HOST }}'
            Add-Content \$envPath 'MSSQL_DATABASE=${{ secrets.MSSQL_DATABASE }}'
            Add-Content \$envPath 'MSSQL_USERNAME=${{ secrets.MSSQL_USERNAME }}'
            Add-Content \$envPath 'MSSQL_PASSWORD=${{ secrets.MSSQL_PASSWORD }}'
            Add-Content \$envPath 'EXTERNAL_API_BASE_URL=${{ secrets.EXTERNAL_API_BASE_URL }}'
            Add-Content \$envPath 'APIM_SUBSCRIPTION_KEY=${{ secrets.APIM_SUBSCRIPTION_KEY }}'

            Add-Content \$envPath 'POLL_INTERVAL_SECONDS=5'
            Add-Content \$envPath 'MAX_CONCURRENT_JOBS=3'
            Add-Content \$envPath 'REQUEST_TIMEOUT_SECONDS=120'
            Add-Content \$envPath 'MAX_RETRIES=3'
            Add-Content \$envPath 'RETRY_DELAY_SECONDS=5.0'
            Add-Content \$envPath 'LOG_LEVEL=INFO'
            Add-Content \$envPath 'LOG_FILE=logs/service.log'

            Write-Host 'ENV FILE CREATED:'
            Get-Content \$envPath

            # -----------------------------
            # Use Python 3.11 (IMPORTANT FIX)
            # -----------------------------
            \$pythonPath = 'C:\Users\azureuser\AppData\Local\Programs\Python\Python311\python.exe'

            # Remove old venv
            if (Test-Path 'venv') {
              Remove-Item -Recurse -Force venv
            }

            # Create new venv
            & \$pythonPath -m venv venv

            # Activate venv
            .\venv\Scripts\activate

            # Upgrade pip
            python -m pip install --upgrade pip

            # Install dependencies
            pip install -r requirements.txt

            # Ensure logs folder exists
            if (!(Test-Path 'logs')) {
              New-Item -ItemType Directory -Path 'logs'
            }

            # Stop old process
            Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force

            # Start app (with logging)
            Start-Process python -ArgumentList 'main.py' `
              -RedirectStandardOutput output.log `
              -RedirectStandardError error.log

            Write-Host 'Deployment completed successfully!'
            "
