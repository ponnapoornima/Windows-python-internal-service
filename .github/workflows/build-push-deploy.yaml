name: Deploy Python Polling Service (Windows VM)

on:
  push:
    branches:
      - developer
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Copy full project to VM
      - name: Copy project files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "C:/Users/azureuser/python-internal-service"

      # Step 3: Deploy on VM
      - name: Deploy Application on Windows VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            powershell -ExecutionPolicy Bypass -Command "
            Write-Host 'Starting deployment...'

            $projectPath = 'C:\Users\azureuser\python-internal-service'
            Set-Location $projectPath

            # -----------------------------
            # Create .env file safely (line by line)
            # -----------------------------
            $envFile = Join-Path $projectPath '.env'

            if (Test-Path $envFile) { Remove-Item $envFile -Force }

            $envVars = @{
              'MSSQL_HOST' = '${{ secrets.MSSQL_HOST }}'
              'MSSQL_DATABASE' = '${{ secrets.MSSQL_DATABASE }}'
              'MSSQL_USERNAME' = '${{ secrets.MSSQL_USERNAME }}'
              'MSSQL_PASSWORD' = '${{ secrets.MSSQL_PASSWORD }}'
              'EXTERNAL_API_BASE_URL' = '${{ secrets.EXTERNAL_API_BASE_URL }}'
              'APIM_SUBSCRIPTION_KEY' = '${{ secrets.APIM_SUBSCRIPTION_KEY }}'
              'POLL_INTERVAL_SECONDS' = '5'
              'MAX_CONCURRENT_JOBS' = '3'
              'REQUEST_TIMEOUT_SECONDS' = '120'
              'MAX_RETRIES' = '3'
              'RETRY_DELAY_SECONDS' = '5.0'
              'LOG_LEVEL' = 'INFO'
              'LOG_FILE' = 'logs/service.log'
            }

            foreach ($key in $envVars.Keys) {
              Add-Content -Path $envFile -Value "$key=$($envVars[$key])"
            }

            Write-Host '.env file created successfully.'
            Get-Content $envFile

            # -----------------------------
            # Use Python 3.11
            # -----------------------------
            $pythonPath = 'C:\Users\azureuser\AppData\Local\Programs\Python\Python311\python.exe'

            # Remove old venv
            if (Test-Path 'venv') { Remove-Item -Recurse -Force venv }

            # Create new venv
            & $pythonPath -m venv venv

            # Activate venv
            .\venv\Scripts\activate

            # Upgrade pip and install dependencies
            python -m pip install --upgrade pip
            pip install -r requirements.txt

            # Ensure logs folder exists
            if (!(Test-Path 'logs')) { New-Item -ItemType Directory -Path 'logs' }

            # Stop old Python processes
            Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force

            # Start app in background
            Start-Process python -ArgumentList 'main.py' `
              -RedirectStandardOutput output.log `
              -RedirectStandardError error.log

            Write-Host 'Deployment completed successfully!'
            "
