name: Deploy and Verify Python Internal Polling Service on VM with Docker

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: SSH into VM and deploy Docker container
      - name: Deploy Dockerized Python Service on VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            VM_USER="${{ secrets.VM_USER }}"
            APP_DIR="/home/$VM_USER/python-internal-service"

            # Clone repo if not exists
            cd /home/$VM_USER
            if [ ! -d "python-internal-service" ]; then
              git clone https://${{ secrets.PAT }}@github.com/ponnapoornima/python-internal-service.git python-internal-service
            fi

            cd python-internal-service
            git fetch --all
            git reset --hard origin/developer

            # Install Docker if not installed
            if ! command -v docker &> /dev/null; then
              sudo apt update
              sudo apt install -y docker.io
            fi

            # Build Docker image
            sudo docker build -t python-internal-service:latest .

            # Stop existing container if running
            if sudo docker ps -q --filter "name=python-internal-service" | grep -q .; then
              sudo docker stop python-internal-service
              sudo docker rm python-internal-service
            fi

            # Run container with environment variables
            sudo docker run -d --name python-internal-service \
              -e MSSQL_HOST=${{ secrets.MSSQL_HOST }} \
              -e MSSQL_DATABASE=${{ secrets.MSSQL_DATABASE }} \
              -e MSSQL_USERNAME=${{ secrets.MSSQL_USERNAME }} \
              -e MSSQL_PASSWORD=${{ secrets.MSSQL_PASSWORD }} \
              -e EXTERNAL_API_BASE_URL=${{ secrets.EXTERNAL_API_BASE_URL }} \
              -e APIM_SUBSCRIPTION_KEY=${{ secrets.APIM_SUBSCRIPTION_KEY }} \
              python-internal-service:latest

            echo "Docker container deployed successfully"

      # Step 3: Verify container is running
      - name: Verify Docker Container
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            CONTAINER_NAME="python-internal-service"
            echo "======================================"
            echo "Checking if Docker container is running..."
            echo "======================================"

            if sudo docker ps --filter "name=$CONTAINER_NAME" --filter "status=running" -q | grep -q .; then
              echo "Container is RUNNING"
            else
              echo "Container is NOT running"
              exit 1
            fi

            echo ""
            echo "Last 30 logs of container:"
            echo "======================================"
            sudo docker logs --tail 30 $CONTAINER_NAME
            echo "======================================"
