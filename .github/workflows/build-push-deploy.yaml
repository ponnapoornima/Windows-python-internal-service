name: Deploy Python Polling Service (Windows VM)

on:
  push:
    branches:
      - developer
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout workflow repo (needed for PAT)
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Deploy on Windows VM
      - name: Deploy Application on Windows VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            powershell -ExecutionPolicy Bypass -Command "
            $ErrorActionPreference = 'Stop'

            $projectPath = 'C:\Users\${{ secrets.VM_USER }}\python-internal-service'
            $envPath = Join-Path $projectPath '.env'
            $pythonPath = 'C:\Users\${{ secrets.VM_USER }}\AppData\Local\Programs\Python\Python311\python.exe'

            # -----------------------------
            # Clone repo if missing, else update
            # -----------------------------
            if (-Not (Test-Path (Join-Path $projectPath '.git'))) {
              git clone https://${{ secrets.PAT }}@github.com/ponnapoornima/python-internal-service.git $projectPath
            } else {
              Set-Location $projectPath
              git fetch --all
              git reset --hard origin/developer
            }

            # Step into project folder
            Set-Location $projectPath

            # -----------------------------
            # Create .env file
            # -----------------------------
            $envContent = @(
              'MSSQL_HOST=${{ secrets.MSSQL_HOST }}'
              'MSSQL_DATABASE=${{ secrets.MSSQL_DATABASE }}'
              'MSSQL_USERNAME=${{ secrets.MSSQL_USERNAME }}'
              'MSSQL_PASSWORD=${{ secrets.MSSQL_PASSWORD }}'
              'EXTERNAL_API_BASE_URL=${{ secrets.EXTERNAL_API_BASE_URL }}'
              'APIM_SUBSCRIPTION_KEY=${{ secrets.APIM_SUBSCRIPTION_KEY }}'
              'POLL_INTERVAL_SECONDS=5'
              'MAX_CONCURRENT_JOBS=3'
              'REQUEST_TIMEOUT_SECONDS=120'
              'MAX_RETRIES=3'
              'RETRY_DELAY_SECONDS=5.0'
              'LOG_LEVEL=INFO'
              'LOG_FILE=logs/service.log'
            )
            $envContent | Set-Content $envPath -Force
            Write-Host '✅ .env file created'

            # -----------------------------
            # Setup Python virtual environment
            # -----------------------------
            if (Test-Path 'venv') { Remove-Item -Recurse -Force venv }
            & $pythonPath -m venv venv
            .\venv\Scripts\activate
            python -m pip install --upgrade pip
            pip install -r requirements.txt

            # Ensure logs folder exists
            if (-Not (Test-Path 'logs')) { New-Item -ItemType Directory -Path 'logs' }

            # -----------------------------
            # Stop old process
            # -----------------------------
            Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force

            # -----------------------------
            # Start app in background
            # -----------------------------
            Start-Process python -ArgumentList 'main.py' `
              -RedirectStandardOutput output.log `
              -RedirectStandardError error.log

            Write-Host '✅ Deployment completed successfully!'
            "
