name: Deploy Python Internal Polling Service to Windows VM

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - developer
  workflow_dispatch:

jobs:
  deploy-and-run:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Deploy to Windows VM
      - name: Deploy Python Service on Windows VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            $ErrorActionPreference = "Stop"

            $APP_DIR = "C:\Users\${{ secrets.VM_USER }}\python-internal-service"
            $VENV_PATH = Join-Path $APP_DIR "venv"
            $LOG_FILE = Join-Path $APP_DIR "logs\service.log"

            # 1️⃣ Clone or update repo
            if (-Not (Test-Path $APP_DIR)) {
                git clone https://${{ secrets.PAT }}@github.com/ponnapoornima/python-internal-service.git $APP_DIR
            } else {
                Set-Location $APP_DIR
                git fetch --all
                git reset --hard origin/developer
            }

            Set-Location $APP_DIR

            # 2️⃣ Ensure logs folder exists
            if (-Not (Test-Path "$APP_DIR\logs")) {
                New-Item -ItemType Directory -Path "$APP_DIR\logs" | Out-Null
            }

            # 3️⃣ Create virtual environment if missing
            if (-Not (Test-Path $VENV_PATH)) {
                python -m venv $VENV_PATH
            }

            # 4️⃣ Install dependencies
            & "$VENV_PATH\Scripts\pip.exe" install --upgrade pip
            & "$VENV_PATH\Scripts\pip.exe" install -r "$APP_DIR\requirements.txt"

            # 5️⃣ Create .env file
            $envContent = @(
              "MSSQL_HOST=${{ secrets.MSSQL_HOST }}"
              "MSSQL_DATABASE=${{ secrets.MSSQL_DATABASE }}"
              "MSSQL_USERNAME=${{ secrets.MSSQL_USERNAME }}"
              "MSSQL_PASSWORD=${{ secrets.MSSQL_PASSWORD }}"
              "EXTERNAL_API_BASE_URL=${{ secrets.EXTERNAL_API_BASE_URL }}"
              "POLL_INTERVAL_SECONDS=5"
              "MAX_CONCURRENT_JOBS=3"
              "REQUEST_TIMEOUT_SECONDS=120"
              "MAX_RETRIES=3"
              "RETRY_DELAY_SECONDS=5.0"
              "APIM_SUBSCRIPTION_KEY=${{ secrets.APIM_SUBSCRIPTION_KEY }}"
              "LOG_LEVEL=INFO"
              "LOG_FILE=$LOG_FILE"
            )
            $envContent | Set-Content "$APP_DIR\.env"

            # 6️⃣ Run the Python app in background
            Start-Process -FilePath "$VENV_PATH\Scripts\python.exe" -ArgumentList "$APP_DIR\main.py" -WindowStyle Hidden
            Write-Host "✅ Python Internal Polling Service started in background."
