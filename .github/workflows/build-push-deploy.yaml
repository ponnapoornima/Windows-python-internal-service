name: Deploy and Verify Python Internal Polling Service to VM

on:
  push:
    branches:
      - developer
  workflow_dispatch:

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Deploy to VM
      - name: Deploy Python Service on VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e

            APP_DIR="/home/${{ secrets.VM_USER }}/python-internal-service"
            SERVICE_FILE="/etc/systemd/system/python-polling.service"

            echo "📦 Cloning or updating repo..."
            cd /home/${{ secrets.VM_USER }}

            if [ ! -d "python-internal-service" ]; then
              git clone https://${{ secrets.PAT }}@github.com/ponnapoornima/python-internal-service.git
            fi

            cd python-internal-service
            git fetch --all
            git reset --hard origin/developer

            echo "⚙️ Installing dependencies..."
            sudo apt update
            sudo apt install -y python3 python3-venv python3-pip git curl

            echo "🧱 Setting up virtual environment..."
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt

            mkdir -p logs

            echo "🔐 Creating .env file..."
            cat <<EOF > .env
            MSSQL_HOST=${{ secrets.MSSQL_HOST }}
            MSSQL_DATABASE=${{ secrets.MSSQL_DATABASE }}
            MSSQL_USERNAME=${{ secrets.MSSQL_USERNAME }}
            MSSQL_PASSWORD=${{ secrets.MSSQL_PASSWORD }}
            EXTERNAL_API_BASE_URL=${{ secrets.EXTERNAL_API_BASE_URL }}
            POLL_INTERVAL_SECONDS=5
            MAX_CONCURRENT_JOBS=3
            REQUEST_TIMEOUT_SECONDS=120
            MAX_RETRIES=3
            RETRY_DELAY_SECONDS=5.0
            APIM_SUBSCRIPTION_KEY=${{ secrets.APIM_SUBSCRIPTION_KEY }}
            LOG_LEVEL=INFO
            LOG_FILE=logs/service.log
            EOF

            chmod 600 .env

            echo "🛠 Creating systemd service..."
            sudo bash -c "cat > $SERVICE_FILE" <<EOL
            [Unit]
            Description=Python Internal Polling Service
            After=network.target

            [Service]
            User=${{ secrets.VM_USER }}
            WorkingDirectory=$APP_DIR
            ExecStart=$APP_DIR/venv/bin/python main.py
            Restart=always
            RestartSec=5
            Environment=PYTHONUNBUFFERED=1

            [Install]
            WantedBy=multi-user.target
            EOL

            echo "🔄 Reloading systemd..."
            sudo systemctl daemon-reload
            sudo systemctl enable python-polling.service

            echo "🚀 Restarting service..."
            sudo systemctl restart python-polling.service

      # Step 3: Verify deployment
      - name: Verify Service
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            SERVICE_NAME="python-polling.service"

            echo "🔍 Checking service status..."

            if systemctl is-active --quiet $SERVICE_NAME; then
              echo "✅ Service is RUNNING"
            else
              echo "❌ Service is NOT running"
              sudo journalctl -u $SERVICE_NAME -n 50 --no-pager
              exit 1
            fi

            echo ""
            echo "📄 Last 30 logs:"
            sudo journalctl -u $SERVICE_NAME -n 30 --no-pager

            echo "✅ Deployment Verified Successfully"
