name: Deploy and Run Python Polling Service (Windows VM)

on:
  push:
    branches:
      - developer
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to Windows VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd C:\Users\azureuser\python-internal-service

            echo Creating .env file...

            echo MSSQL_HOST=${{ secrets.MSSQL_HOST }} > .env
            echo MSSQL_DATABASE=${{ secrets.MSSQL_DATABASE }} >> .env
            echo MSSQL_USERNAME=${{ secrets.MSSQL_USERNAME }} >> .env
            echo MSSQL_PASSWORD=${{ secrets.MSSQL_PASSWORD }} >> .env
            echo EXTERNAL_API_BASE_URL=${{ secrets.EXTERNAL_API_BASE_URL }} >> .env
            echo APIM_SUBSCRIPTION_KEY=${{ secrets.APIM_SUBSCRIPTION_KEY }} >> .env

            echo POLL_INTERVAL_SECONDS=5 >> .env
            echo MAX_CONCURRENT_JOBS=3 >> .env
            echo REQUEST_TIMEOUT_SECONDS=120 >> .env
            echo MAX_RETRIES=3 >> .env
            echo RETRY_DELAY_SECONDS=5.0 >> .env

            echo LOG_LEVEL=INFO >> .env
            echo LOG_FILE=logs/service.log >> .env

            echo .env file created:
            type .env

            echo Activating virtual environment...
            call venv\Scripts\activate

            echo Installing dependencies...
            pip install -r requirements.txt

            echo Stopping existing Python process (if any)...
            taskkill /IM python.exe /F || echo No existing process
            echo Starting application...
            start /B python main.py

            echo Deployment completed successfully!
