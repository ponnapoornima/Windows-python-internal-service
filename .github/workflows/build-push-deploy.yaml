name: Deploy Python Polling Service (Windows VM)

on:
  push:
    branches:
      - developer
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Copy deploy script to Windows VM
      - name: Copy deploy.ps1 to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.ps1"
          target: "C:/Users/azureuser/"

      # Step 3: Execute deployment on VM
      - name: Deploy Application on Windows VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          # 🔥 IMPORTANT: Map GitHub secrets to environment variables
          env:
            MSSQL_HOST: ${{ secrets.MSSQL_HOST }}
            MSSQL_DATABASE: ${{ secrets.MSSQL_DATABASE }}
            MSSQL_USERNAME: ${{ secrets.MSSQL_USERNAME }}
            MSSQL_PASSWORD: ${{ secrets.MSSQL_PASSWORD }}
            EXTERNAL_API_BASE_URL: ${{ secrets.EXTERNAL_API_BASE_URL }}
            APIM_SUBSCRIPTION_KEY: ${{ secrets.APIM_SUBSCRIPTION_KEY }}

          # Pass env variables to remote session
          envs: MSSQL_HOST,MSSQL_DATABASE,MSSQL_USERNAME,MSSQL_PASSWORD,EXTERNAL_API_BASE_URL,APIM_SUBSCRIPTION_KEY

          script: |
            powershell -ExecutionPolicy Bypass -Command "
            
            Write-Host 'Starting deployment...'

            \$projectPath = 'C:\Users\azureuser\python-internal-service'
            \$envPath = \"\$projectPath\.env\"

            # Ensure project directory exists
            if (!(Test-Path \$projectPath)) {
              Write-Host 'Project folder not found!'
              exit 1
            }

            Set-Location \$projectPath

            # Create .env file
            New-Item -Path \$envPath -ItemType File -Force

            # Write secrets to .env
            Add-Content \$envPath \"MSSQL_HOST=$env:MSSQL_HOST\"
            Add-Content \$envPath \"MSSQL_DATABASE=$env:MSSQL_DATABASE\"
            Add-Content \$envPath \"MSSQL_USERNAME=$env:MSSQL_USERNAME\"
            Add-Content \$envPath \"MSSQL_PASSWORD=$env:MSSQL_PASSWORD\"
            Add-Content \$envPath \"EXTERNAL_API_BASE_URL=$env:EXTERNAL_API_BASE_URL\"
            Add-Content \$envPath \"APIM_SUBSCRIPTION_KEY=$env:APIM_SUBSCRIPTION_KEY\"

            # Static configs
            Add-Content \$envPath \"POLL_INTERVAL_SECONDS=5\"
            Add-Content \$envPath \"MAX_CONCURRENT_JOBS=3\"
            Add-Content \$envPath \"REQUEST_TIMEOUT_SECONDS=120\"
            Add-Content \$envPath \"MAX_RETRIES=3\"
            Add-Content \$envPath \"RETRY_DELAY_SECONDS=5.0\"
            Add-Content \$envPath \"LOG_LEVEL=INFO\"
            Add-Content \$envPath \"LOG_FILE=logs/service.log\"

            Write-Host 'ENV FILE CREATED:'
            Get-Content \$envPath

            # Stop existing Python process
            Write-Host 'Stopping existing service (if running)...'
            Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force

            # Start application
            Write-Host 'Starting application...'
            Start-Process python -ArgumentList 'main.py'

            Write-Host 'Deployment completed successfully!'
            "
