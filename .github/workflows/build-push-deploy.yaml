name: Deploy and Verify Python Internal Polling Service to Windows VM

on:
  push:
    branches:
      - developer
  workflow_dispatch:

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Deploy to Windows VM
      - name: Deploy Python Service on Windows VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            powershell -Command "
            Write-Output 'Deploying to Windows VM...'

            $APP_DIR = 'C:\Users\${{ secrets.VM_USER }}\python-internal-service'

            if (!(Test-Path $APP_DIR)) {
              New-Item -ItemType Directory -Path $APP_DIR
            }

            Set-Location $APP_DIR

            if (!(Test-Path '.git')) {
              git clone https://${{ secrets.PAT }}@github.com/ponnapoornima/python-internal-service.git .
            } else {
              git fetch --all
              git reset --hard origin/developer
            }

            if (!(Test-Path 'venv')) {
              python -m venv venv
            }

            .\venv\Scripts\Activate.ps1

            pip install --upgrade pip
            pip install -r requirements.txt

            if (!(Test-Path 'logs')) {
              New-Item -ItemType Directory -Path logs
            }

            Write-Output 'Creating .env file...'

            $envContent = @(
              'MSSQL_HOST=${{ secrets.MSSQL_HOST }}',
              'MSSQL_DATABASE=${{ secrets.MSSQL_DATABASE }}',
              'MSSQL_USERNAME=${{ secrets.MSSQL_USERNAME }}',
              'MSSQL_PASSWORD=${{ secrets.MSSQL_PASSWORD }}',
              'EXTERNAL_API_BASE_URL=${{ secrets.EXTERNAL_API_BASE_URL }}',
              'POLL_INTERVAL_SECONDS=5',
              'MAX_CONCURRENT_JOBS=3',
              'REQUEST_TIMEOUT_SECONDS=120',
              'MAX_RETRIES=3',
              'RETRY_DELAY_SECONDS=5.0',
              'APIM_SUBSCRIPTION_KEY=${{ secrets.APIM_SUBSCRIPTION_KEY }}',
              'LOG_LEVEL=INFO',
              'LOG_FILE=logs/service.log'
            )

            $envContent | Out-File -Encoding ASCII .env

            Write-Output 'Stopping existing Python process...'
            Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force

            Write-Output 'Starting application...'
            Start-Process -NoNewWindow -FilePath 'python' -ArgumentList 'main.py'
            "

      # Verify deployment
      - name: Verify Service
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            powershell -Command "
            Write-Output 'Checking Python process...'

            $process = Get-Process python -ErrorAction SilentlyContinue

            if ($process) {
              Write-Output 'Python service is RUNNING'
            } else {
              Write-Output 'Python service is NOT running'
              exit 1
            }

            $logPath = 'C:\Users\${{ secrets.VM_USER }}\python-internal-service\logs\service.log'

            if (Test-Path $logPath) {
              Get-Content $logPath -Tail 30
            } else {
              Write-Output 'No log file found'
            }
            "
