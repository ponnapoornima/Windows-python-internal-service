name: Deploy Python Polling Service (Windows VM)

on:
  push:
    branches:
      - developer
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout workflow repo (GitHub Actions repo)
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Deploy on Windows VM
      - name: Deploy on Windows VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          env:
          PAT: ${{ secrets.PAT }}
          script: |
            powershell -ExecutionPolicy Bypass -Command "
            
            $projectDir = 'C:\Users\azureuser\Windows-python-internal-service'
            $pythonPath = 'C:\Users\azureuser\AppData\Local\Programs\Python\Python311\python.exe'

            # Delete old folder if exists
            if (Test-Path $projectDir) {
              Remove-Item -Recurse -Force $projectDir
            }

            # Clone repo using PAT
            git clone https://$env:PAT@github.com/ponnapoornima/Windows-python-internal-service.git $projectDir

            # Go to project folder
            Set-Location $projectDir

            # Create .env file with secrets
            $envFile = Join-Path $projectDir '.env'
            New-Item -Path $envFile -ItemType File -Force
            Add-Content $envFile 'MSSQL_HOST=${{ secrets.MSSQL_HOST }}'
            Add-Content $envFile 'MSSQL_DATABASE=${{ secrets.MSSQL_DATABASE }}'
            Add-Content $envFile 'MSSQL_USERNAME=${{ secrets.MSSQL_USERNAME }}'
            Add-Content $envFile 'MSSQL_PASSWORD=${{ secrets.MSSQL_PASSWORD }}'
            Add-Content $envFile 'EXTERNAL_API_BASE_URL=${{ secrets.EXTERNAL_API_BASE_URL }}'
            Add-Content $envFile 'APIM_SUBSCRIPTION_KEY=${{ secrets.APIM_SUBSCRIPTION_KEY }}'
            Add-Content $envFile 'POLL_INTERVAL_SECONDS=5'
            Add-Content $envFile 'MAX_CONCURRENT_JOBS=3'
            Add-Content $envFile 'REQUEST_TIMEOUT_SECONDS=120'
            Add-Content $envFile 'MAX_RETRIES=3'
            Add-Content $envFile 'RETRY_DELAY_SECONDS=5.0'
            Add-Content $envFile 'LOG_LEVEL=INFO'
            Add-Content $envFile 'LOG_FILE=logs/service.log'

            # Remove old virtual environment
            if (Test-Path 'venv') {
              Remove-Item -Recurse -Force venv
            }

            # Create virtual environment
            & $pythonPath -m venv venv

            # Activate virtual environment
            .\venv\Scripts\activate

            # Upgrade pip and install dependencies
            python -m pip install --upgrade pip
            pip install -r requirements.txt

            # Ensure logs folder exists
            if (!(Test-Path 'logs')) {
              New-Item -ItemType Directory -Path 'logs'
            }

            # Stop old python processes
            Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force

            # Start the application
            Start-Process python -ArgumentList 'main.py' `
              -RedirectStandardOutput output.log `
              -RedirectStandardError error.log

            Write-Host '✅ Deployment completed successfully!'
            "
