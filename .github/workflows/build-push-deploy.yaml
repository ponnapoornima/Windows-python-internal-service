name: Deploy Python Polling Service to Windows VM

on:
  push:
    branches:
      - developer
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout workflow repo (optional)
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Deploy on Windows VM
      - name: Deploy Application on Windows VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            powershell -ExecutionPolicy Bypass -Command "
            $ErrorActionPreference = 'Stop'

            # -----------------------------
            # Paths and Python setup
            # -----------------------------
            $basePath = 'C:\Users\azureuser'
            $projectFolder = 'Windows-python-internal-service'
            $projectPath = Join-Path $basePath $projectFolder
            $envPath = Join-Path $projectPath '.env'
            $pythonPath = 'C:\Users\azureuser\AppData\Local\Programs\Python\Python311\python.exe'

            # -----------------------------
            # Clone the repo if it doesn't exist
            # -----------------------------
            if (!(Test-Path $projectPath)) {
                git clone https://github.com/ponnapoornima/Windows-python-internal-service.git $projectPath
            } else {
                Set-Location $projectPath
                git fetch --all
                git reset --hard origin/developer
            }

            # Move to project folder
            Set-Location $projectPath

            # -----------------------------
            # Create .env file from secrets
            # -----------------------------
            $envContent = @(
                'MSSQL_HOST=${{ secrets.MSSQL_HOST }}'
                'MSSQL_DATABASE=${{ secrets.MSSQL_DATABASE }}'
                'MSSQL_USERNAME=${{ secrets.MSSQL_USERNAME }}'
                'MSSQL_PASSWORD=${{ secrets.MSSQL_PASSWORD }}'
                'EXTERNAL_API_BASE_URL=${{ secrets.EXTERNAL_API_BASE_URL }}'
                'APIM_SUBSCRIPTION_KEY=${{ secrets.APIM_SUBSCRIPTION_KEY }}'
                'POLL_INTERVAL_SECONDS=5'
                'MAX_CONCURRENT_JOBS=3'
                'REQUEST_TIMEOUT_SECONDS=120'
                'MAX_RETRIES=3'
                'RETRY_DELAY_SECONDS=5.0'
                'LOG_LEVEL=INFO'
                'LOG_FILE=logs/service.log'
            )
            $envContent | Out-File -FilePath $envPath -Encoding utf8 -Force

            # -----------------------------
            # Remove old venv if exists
            # -----------------------------
            if (Test-Path 'venv') {
                Remove-Item -Recurse -Force venv
            }

            # Create and activate new venv
            & $pythonPath -m venv venv
            .\venv\Scripts\activate

            # Upgrade pip and install dependencies
            python -m pip install --upgrade pip
            pip install -r requirements.txt

            # Ensure logs folder exists
            if (!(Test-Path 'logs')) {
                New-Item -ItemType Directory -Path 'logs'
            }

            # Stop old Python processes
            Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force

            # Start the application
            Start-Process python -ArgumentList 'main.py' `
              -RedirectStandardOutput 'output.log' `
              -RedirectStandardError 'error.log'

            Write-Host '✅ Deployment completed successfully!'
            "
