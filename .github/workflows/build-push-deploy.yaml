name: Deploy Python Polling Service (Windows VM)

on:
  push:
    branches:
      - developer
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PAT: ${{ secrets.PAT }}
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      MSSQL_HOST: ${{ secrets.MSSQL_HOST }}
      MSSQL_DATABASE: ${{ secrets.MSSQL_DATABASE }}
      MSSQL_USERNAME: ${{ secrets.MSSQL_USERNAME }}
      MSSQL_PASSWORD: ${{ secrets.MSSQL_PASSWORD }}
      EXTERNAL_API_BASE_URL: ${{ secrets.EXTERNAL_API_BASE_URL }}
      APIM_SUBSCRIPTION_KEY: ${{ secrets.APIM_SUBSCRIPTION_KEY }}

    steps:
      - name: Checkout Repository (CI)
        uses: actions/checkout@v3

      - name: Deploy on Windows VM
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ env.VM_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            powershell -ExecutionPolicy Bypass -Command "

            Write-Host '🔹 Starting deployment...'

            $projectDir = 'C:\Users\azureuser\Windows-python-internal-service'

            # -----------------------------
            # Clone or update repo
            # -----------------------------
            if (Test-Path $projectDir) {
              Write-Host 'Repo exists, pulling latest changes...'
              Set-Location $projectDir
              git reset --hard
              git fetch --all
              git checkout developer
              git pull origin developer
            } else {
              Write-Host 'Cloning repo...'
              $pat = '$env:PAT'
              $repoUrl = 'https://'+$pat+'@github.com/ponnapoornima/Windows-python-internal-service.git'
              git clone $repoUrl $projectDir
              Set-Location $projectDir
            }

            # -----------------------------
            # Create .env file
            # -----------------------------
            $envFile = Join-Path $projectDir '.env'

            @(
              'MSSQL_HOST=$env:MSSQL_HOST',
              'MSSQL_DATABASE=$env:MSSQL_DATABASE',
              'MSSQL_USERNAME=$env:MSSQL_USERNAME',
              'MSSQL_PASSWORD=$env:MSSQL_PASSWORD',
              'EXTERNAL_API_BASE_URL=$env:EXTERNAL_API_BASE_URL',
              'APIM_SUBSCRIPTION_KEY=$env:APIM_SUBSCRIPTION_KEY',
              'POLL_INTERVAL_SECONDS=5',
              'MAX_CONCURRENT_JOBS=3',
              'REQUEST_TIMEOUT_SECONDS=120',
              'MAX_RETRIES=3',
              'RETRY_DELAY_SECONDS=5.0',
              'LOG_LEVEL=INFO',
              'LOG_FILE=logs/service.log'
            ) | Set-Content -Path $envFile -Force

            Write-Host '.env file created:'
            Get-Content $envFile

            # -----------------------------
            # Setup Python 3.11 venv
            # -----------------------------
            $pythonPath = 'C:\Users\azureuser\AppData\Local\Programs\Python\Python311\python.exe'

            if (Test-Path 'venv') {
              Remove-Item -Recurse -Force 'venv'
            }

            & $pythonPath -m venv venv

            # Activate venv
            .\venv\Scripts\activate

            # Upgrade pip
            python -m pip install --upgrade pip

            # Install dependencies
            pip install -r requirements.txt

            # Ensure logs folder exists
            if (!(Test-Path 'logs')) {
              New-Item -ItemType Directory -Path 'logs'
            }

            # Stop old python processes
            Get-Process python -ErrorAction SilentlyContinue | Stop-Process -Force

            # Start application
            Start-Process python -ArgumentList 'main.py' `
              -RedirectStandardOutput 'output.log' `
              -RedirectStandardError 'error.log'

            Write-Host '✅ Deployment completed successfully!'
            "
