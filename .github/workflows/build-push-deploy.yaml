name: Deploy Python Internal Polling Service to Windows VM

on:
  push:
    branches:
      - developer
  workflow_dispatch:

jobs:
  deploy-and-verify:
    runs-on: windows-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Deploy to Windows VM
      - name: Deploy Python Service on Windows VM
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            $ErrorActionPreference = "Stop"
            
            # Paths
            $APP_DIR = "C:\Users\${{ secrets.VM_USER }}\python-internal-service"
            $VENV_PATH = Join-Path $APP_DIR "venv"
            $SERVICE_NAME = "PythonPollingService"
            $LOG_FILE = Join-Path $APP_DIR "logs\service.log"
            
            # Clone or update repo
            if (-Not (Test-Path $APP_DIR)) {
                git clone https://${{ secrets.PAT }}@github.com/ponnapoornima/python-internal-service.git $APP_DIR
            }
            Set-Location $APP_DIR
            git fetch --all
            git reset --hard origin/developer
            
            # Ensure Python is installed
            if (-Not (Get-Command python -ErrorAction SilentlyContinue)) {
                choco install python -y
            }
            
            # Setup virtual environment
            if (-Not (Test-Path $VENV_PATH)) {
                python -m venv $VENV_PATH
            }
            
            # Install dependencies
            & "$VENV_PATH\Scripts\pip.exe" install --upgrade pip
            & "$VENV_PATH\Scripts\pip.exe" install -r requirements.txt
            
            # Create logs folder
            if (-Not (Test-Path "$APP_DIR\logs")) {
                New-Item -ItemType Directory -Path "$APP_DIR\logs" | Out-Null
            }
            
            # Create .env file (production safe)
            Set-Content -Path "$APP_DIR\.env" -Value ("MSSQL_HOST=${{ secrets.MSSQL_HOST }}")
            Add-Content -Path "$APP_DIR\.env" -Value ("MSSQL_DATABASE=${{ secrets.MSSQL_DATABASE }}")
            Add-Content -Path "$APP_DIR\.env" -Value ("MSSQL_USERNAME=${{ secrets.MSSQL_USERNAME }}")
            Add-Content -Path "$APP_DIR\.env" -Value ("MSSQL_PASSWORD=${{ secrets.MSSQL_PASSWORD }}")
            Add-Content -Path "$APP_DIR\.env" -Value ("EXTERNAL_API_BASE_URL=${{ secrets.EXTERNAL_API_BASE_URL }}")
            Add-Content -Path "$APP_DIR\.env" -Value ("POLL_INTERVAL_SECONDS=5")
            Add-Content -Path "$APP_DIR\.env" -Value ("MAX_CONCURRENT_JOBS=3")
            Add-Content -Path "$APP_DIR\.env" -Value ("REQUEST_TIMEOUT_SECONDS=120")
            Add-Content -Path "$APP_DIR\.env" -Value ("MAX_RETRIES=3")
            Add-Content -Path "$APP_DIR\.env" -Value ("RETRY_DELAY_SECONDS=5.0")
            Add-Content -Path "$APP_DIR\.env" -Value ("APIM_SUBSCRIPTION_KEY=${{ secrets.APIM_SUBSCRIPTION_KEY }}")
            Add-Content -Path "$APP_DIR\.env" -Value ("LOG_LEVEL=INFO")
            Add-Content -Path "$APP_DIR\.env" -Value ("LOG_FILE=$LOG_FILE")
            
            # Create or update Windows service via NSSM
            $NSSM_PATH = "C:\nssm\nssm.exe"
            if (-Not (Test-Path $NSSM_PATH)) {
                Write-Host "❌ NSSM not found at $NSSM_PATH. Install NSSM before running workflow."
                exit 1
            }

            # Install or update service
            & $NSSM_PATH install $SERVICE_NAME "$VENV_PATH\Scripts\python.exe" "$APP_DIR\main.py" | Out-Null
            & $NSSM_PATH set $SERVICE_NAME AppDirectory $APP_DIR | Out-Null
            & $NSSM_PATH set $SERVICE_NAME Start SERVICE_AUTO_START | Out-Null
            & $NSSM_PATH restart $SERVICE_NAME | Out-Null

      # Step 3: Verify service
      - name: Verify Service
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            $SERVICE_NAME = "PythonPollingService"
            $APP_DIR = "C:\Users\${{ secrets.VM_USER }}\python-internal-service"
            $LOG_FILE = Join-Path $APP_DIR "logs\service.log"

            $svc = Get-Service -Name $SERVICE_NAME -ErrorAction SilentlyContinue
            if ($null -eq $svc) {
                Write-Host "❌ Service $SERVICE_NAME not found"
                exit 1
            }

            if ($svc.Status -eq "Running") {
                Write-Host "✅ Service is RUNNING"
            } else {
                Write-Host "❌ Service is NOT running, attempting start..."
                Start-Service $SERVICE_NAME
            }

            Write-Host "📄 Last 30 logs:"
            if (Test-Path $LOG_FILE) {
                Get-Content $LOG_FILE -Tail 30
            } else {
                Write-Host "No logs found."
            }

            Write-Host "✅ Deployment Verified Successfully"
